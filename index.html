<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" href="MiniExerciseStarter/css/bootstrap.min.css">
    <link rel="stylesheet" href="MiniExerciseStarter/css/style.css">
</head>
<body>
    <header class="mb-5">
        <div class="container mt-5">
            <!--Mode Toggle-->
            <div class="d-flex justify-content-end">
            <div class="btn-group">
                <button class="btn btn-secondary" data-bs-theme-value="dark">Dark</button>
                <button class="btn btn-light" data-bs-theme-value="light">Light</button>
            </div>
            </div>
            <!--User & Search Box-->
            <h1 class="mb-4">User</h1>
            <div class="row">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-lg" placeholder="Search Users">
                </div>
                <div class="col-md-8 user-menu d-flex justify-content-end align-items-center">
                    <ul class="nav">
                        <li class="nav-item ">
                            <a class="nav-link" href="#">Reputation</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-bg-primary rounded-3" href="#">New Users</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="#">Editors</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="#">Moderators</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <script src="MiniExerciseStarter/js/darkmodetoggle.js"></script>
    <script src="MiniExerciseStarter/js/bootstrap.min.js"></script>
</body>
</html>
